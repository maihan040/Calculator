<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Calculator</title>
    <link rel="stylesheet" href="style.css"></link>
  </head>
  <body>
    <div id="container">
      <!-- div to display result to user  -->
      <div name="calcOP" id="calcOP">0</div>

      <div class="buttons">

        <div id="specialAndInputBtns">
            <!-- div to include special operator buttons -->
            <div class="specialBtns">
                <button class="extraOperators" data-val="allClear" id="AC">AC</button>
                <button class="extraOperators" data-val="negate" id="negate">+/-</button>
                <button class="extraOperators" data-val="percent" id="percentage">%</button>
            </div>
    
            <!-- number buttons -->
            <div class="input" id="inputBtns">
                <div id="row1">
                <button class="inputBtn" data-val="7">7</button>
                <button class="inputBtn" data-val="8">8</button>
                <button class="inputBtn" data-val="9">9</button>
                </div>
                <div id="row2">
                <button class="inputBtn" data-val="4">4</button>
                <button class="inputBtn" data-val="5">5</button>
                <button class="inputBtn" data-val="6">6</button>
                </div>
                <div id="row3">
                <button class="inputBtn" data-val="1">1</button>
                <button class="inputBtn" data-val="2">2</button>
                <button class="inputBtn" data-val="3">3</button>
                </div>
                <div id="row4">
                <button class="inputBtn" data-val="#">&#8596</button> <!-- converter button -->
                <button class="inputBtn" data-val="0">0</button>
                <button class="inputBtn" data-val=".">.</button>
                </div>
            </div>
        </div>

        <!-- mathematical operators  -->
        <div class="operatorBtns">
            <button class="operators" data-val="/" id="div">/</button>
            <button class="operators" data-val="*" id="mult">*</button>
            <button class="operators" data-val="-" id="min">-</button>
            <button class="operators" data-val="+" id="add">+</button>
            <button class="operators" data-val="=" id="equals">=</button>
        </div>
       </div>
    </div>
    <script type="module" src="./javascript/main.js"></script>
  </body>
</html>
